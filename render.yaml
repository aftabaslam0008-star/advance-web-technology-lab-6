services:
  - type: web
    name: advance-web-technology-lab-6
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_USE_EMBEDDED
        value: "true"
      - key: KAFKA_ENABLED
        value: "false"
